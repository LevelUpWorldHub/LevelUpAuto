kind = "web"
previewPath = "/alset/"
title = "Alset Platform"
version = "1.0.0"
id = "artifacts/alset-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/alset/" ]
localPort = 19274

[services.development]
run = "pnpm --filter @workspace/alset-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alset-web", "run", "build" ]
publicDir = "artifacts/alset-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19274"
BASE_PATH = "/alset/"
