kind = "mobile"
previewPath = "/mobile/"
title = "LevelUpAuto Mobile"
version = "1.0.0"
id = "artifacts/levelupauto-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18468

[services.development]
run = "pnpm --filter @workspace/levelupauto-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/levelupauto-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/levelupauto-mobile", "run", "serve" ]

[services.env]
PORT = "18468"
BASE_PATH = "/mobile/"
